name: Build and generate doc

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: "false"
          check-reservoir-eligibility: "false"
      - name: Build docs
        run: |
          cd docbuild
          lake update
          lake build AutoKtchp:docs
      
      - name: Prepare pages
        run: |
          mkdir -p site
          cp -r docbuild/.lake/build/doc site/docs
      
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
